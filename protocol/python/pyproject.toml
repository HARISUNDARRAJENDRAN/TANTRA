[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tantra-protocol"
version = "0.1.0"
description = "Reference implementation of the AksharaLink protocol"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tantra_protocol*"]
