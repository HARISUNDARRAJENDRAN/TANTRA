name: import-tantra-source

on:
  push:
    branches:
      - feat/full-source-import
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import/chunk-* > /tmp/tantra-source.b64
          base64 --decode /tmp/tantra-source.b64 > /tmp/tantra-source.tar.gz
          tar -tzf /tmp/tantra-source.tar.gz | grep -v '/$' | grep -v '^.github/workflows/ci.yml$' > /tmp/tantra-files
          tar -xzf /tmp/tantra-source.tar.gz -C .
          rm -f .github/workflows/ci.yml

      - name: Commit imported source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r path; do
            if [ -n "$path" ]; then
              git add -- "$path"
            fi
          done < /tmp/tantra-files

          git rm -r -- .import
          git rm -- .bootstrap
          git commit -m "feat: import complete TANTRA source tree"
          git push origin HEAD:feat/full-source-import
